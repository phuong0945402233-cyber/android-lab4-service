name: Windows Service countdown verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: service-countdown-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: service-lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract the anonymized Android teaching project
        working-directory: ${{ github.workspace }}
        run: |
          Expand-Archive ./service-countdown-source.zip -DestinationPath ./service-lab -Force
          # Hosted Windows reports WHPX usable but cannot create a partition.
          # Use the official emulator's supported software CPU engine.
          $bootstrap = './service-lab/tools/windows-ci.ps1'
          $code = Get-Content $bootstrap -Raw
          $old = '$acceleration = if ($LASTEXITCODE -eq 0) { ''auto'' } else { ''off'' }'
          if (-not $code.Contains($old)) { throw 'Unexpected emulator bootstrap.' }
          # Retain the official Android 8.1 image used for the successful boot.
          $code = $code.Replace('system-images;android-28;default;x86','system-images;android-27;default;x86')
          # Pin the official 31.3.14 emulator after a Windows TCG access violation.
          $code = $code.Replace('13610412','9322596').Replace('35.6.11','31.3.14')
          $code = $code.Replace("'-no-metrics',", '')
          # Set the low-RAM init profile in a temporary ramdisk; preserve all other entries.
          $code = $code.Replace("'swiftshader_indirect'", "'off'").Replace('hw.gpu.enabled=yes','hw.gpu.enabled=no').Replace('hw.gpu.mode=swiftshader_indirect','hw.gpu.mode=off')
          $code = $code.Replace("'-no-boot-anim'", "'-verbose','-show-kernel','-no-boot-anim'")
          $code = $code.Replace("'-memory','2048'", "'-memory','1536'")
          $code = $code.Replace('hw.lcd.width=720','hw.lcd.width=540').Replace('hw.lcd.height=1280','hw.lcd.height=960').Replace('hw.lcd.density=320','hw.lcd.density=240')
          $code = $code.Replace('.AddMinutes(25)', '.AddMinutes(10)').Replace('within 25 minutes','within 10 minutes')
          $code = $code.Replace('0865071aecf3d90a5b967cb6cb0cd48bea0a58a26ef4953b32037671c129b7e9','647f40e2692001f3b6d55e02d48d056b0eb89dd89e76a5adb896400039016638')
          $code = $code.Replace("@('major','35'),@('minor','6'),@('micro','11')", "@('major','31'),@('minor','3'),@('micro','14')")
          $profileCode = @'
          """Set one non-security Android init property in a disposable emulator ramdisk."""
          from pathlib import Path
          import gzip
          import hashlib
          import json
          import sys
          
          
          def entries(blob):
              offset = 0
              while blob[offset:offset + 6] == b"070701":
                  header = blob[offset:offset + 110]
                  values = [int(header[6 + i * 8:14 + i * 8], 16) for i in range(13)]
                  name_end = offset + 110 + values[11]
                  name_bytes = blob[offset + 110:name_end]
                  start = (name_end + 3) & ~3
                  end = (start + values[6] + 3) & ~3
                  yield header, values, name_bytes, blob[start:start + values[6]]
                  if name_bytes == b"TRAILER!!!\0":
                      return
                  offset = end
              raise ValueError("Unsupported or incomplete cpio ramdisk")
          
          
          def configure(source, target, evidence):
              original = Path(source).read_bytes()
              digest = hashlib.sha256(original).hexdigest()
              expected = "a7580f1e23feaafc4322522799be7d09bd11d690d38f095cd073fa850751d40d"
              if digest != expected:
                  raise ValueError("The official API 27 ramdisk differs from the verified input")
              old = list(entries(gzip.decompress(original)))
              chunks = []
              changed = []
              for header, values, name, content in old:
                  if name == b"init.ranchu.rc\0":
                      marker = b"on early-init\n"
                      assert content.count(marker) == 1
                      assert b"ro.config.low_ram" not in content
                      content = content.replace(marker, marker + b"    setprop ro.config.low_ram true\n", 1)
                      header = header[:54] + f"{len(content):08x}".encode() + header[62:]
                      changed.append(name[:-1].decode())
                  record = header + name
                  record += b"\0" * (-len(record) % 4)
                  record += content
                  record += b"\0" * (-len(content) % 4)
                  chunks.append(record)
              assert changed == ["init.ranchu.rc"]
              modified_cpio = b"".join(chunks)
              modified_cpio += b"\0" * (-len(modified_cpio) % 512)
              new = list(entries(modified_cpio))
              assert len(old) == len(new)
              for before, after in zip(old, new):
                  assert before[2] == after[2]
                  if before[2] != b"init.ranchu.rc\0":
                      assert before == after
                  else:
                      assert after[3].replace(b"    setprop ro.config.low_ram true\n", b"", 1) == before[3]
                      assert before[0][:54] == after[0][:54] and before[0][62:] == after[0][62:]
              output = gzip.compress(modified_cpio, mtime=0)
              Path(target).write_bytes(output)
              result = {"input_sha256": digest, "output_sha256": hashlib.sha256(output).hexdigest(),
                        "changed_files": changed, "added_init_line": "setprop ro.config.low_ram true",
                        "all_other_ramdisk_entries_unchanged": True}
              Path(evidence).write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(result))
          
          
          if __name__ == "__main__":
              configure(*sys.argv[1:])
          '@
          $profileCode | Set-Content './service-lab/tools/configure-guest-profile.py' -Encoding utf8
          $profileSetup = @'
              $guestRamdisk = Join-Path $env:RUNNER_TEMP 'servicecountdown-profile-ramdisk.img'
              $sourceRamdisk = Join-Path $sdk 'system-images/android-27/default/x86/ramdisk.img'
              & python (Join-Path $PSScriptRoot 'configure-guest-profile.py') $sourceRamdisk $guestRamdisk (Join-Path $logs 'ramdisk-profile.json')
              if ($LASTEXITCODE -ne 0) { throw 'Temporary guest boot profile could not be verified.' }
          '@
          $launchMarker = '    $emu = Start-Process -FilePath $emulator -ArgumentList @('
          if (-not $code.Contains($launchMarker)) { throw 'Unexpected emulator launch marker.' }
          $code = $code.Replace($launchMarker, $profileSetup + "`r`n" + $launchMarker)
          $code = $code.Replace("'-avd','LabServiceWindows'", "'-ramdisk',`$guestRamdisk,'-avd','LabServiceWindows'")
          $readiness = @'
              $logcat = Start-Process -FilePath $adb -ArgumentList @('-s','emulator-5554','logcat','-v','threadtime') -PassThru -RedirectStandardOutput (Join-Path $logs 'android-live-logcat.txt') -RedirectStandardError (Join-Path $logs 'android-live-logcat-errors.txt')
              $lowRam = (& $adb -s emulator-5554 shell getprop ro.config.low_ram | Out-String).Trim()
              $lowRam | Set-Content (Join-Path $logs 'low-ram-profile.txt')
              if ($lowRam -ne 'true') { throw 'The requested software framework profile was not applied.' }
              $stableDeadline = (Get-Date).AddMinutes(8)
              $stableSamples = 0
              $priorServer = ''
              do {
                  $server = (& $adb -s emulator-5554 shell pidof system_server 2>$null | Out-String).Trim()
                  $packageReady = (& $adb -s emulator-5554 shell cmd package list packages --user 0 android 2>$null | Out-String).Trim()
                  $packageExit = $LASTEXITCODE
                  $frameworkReady = $packageReady -match '(?m)^package:android\r?$'
                  if ($packageExit -eq 0 -and $frameworkReady -and $server -match '^\d+$' -and $server -eq $priorServer) { $stableSamples++ } else { $stableSamples = 0 }
                  $priorServer = $server
                  ('{0:o} system_server={1} stable_samples={2} package_exit={3} framework_package={4}' -f (Get-Date),$server,$stableSamples,$packageExit,$frameworkReady) | Tee-Object -FilePath (Join-Path $logs 'boot-readiness.txt') -Append
                  if ($stableSamples -ge 3) { break }
                  Start-Sleep -Seconds 5
              } while ((Get-Date) -lt $stableDeadline)
              if ($stableSamples -lt 3) { throw 'Android package service did not stabilize.' }
              & $adb -s emulator-5554 shell getprop | Set-Content (Join-Path $logs 'android-properties.txt')
              & $adb -s emulator-5554 shell dumpsys SurfaceFlinger | Set-Content (Join-Path $logs 'surfaceflinger.txt')
          '@
          $marker = '    & $adb -s emulator-5554 shell input keyevent 82'
          if (-not $code.Contains($marker)) { throw 'Unexpected boot readiness marker.' }
          $code = $code.Replace($marker, $readiness + "`r`n" + $marker)
          $code.Replace($old, '$acceleration = ''off''') | Set-Content $bootstrap -Encoding utf8
          $verify = './service-lab/tools/verify-windows.ps1'
          (Get-Content $verify -Raw).Replace("@('install','-r',", "@('install','--no-streaming','-r',") | Set-Content $verify -Encoding utf8
          # Google's documented Maven Central mirror avoids shared-runner 429s.
          $settings = './service-lab/settings.gradle'
          $repo = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }; mavenCentral()'
          (Get-Content $settings -Raw).Replace('mavenCentral()', $repo) | Set-Content $settings -Encoding utf8
          'org.gradle.workers.max=2' | Add-Content './service-lab/gradle.properties'
          $ideScript = './service-lab/tools/capture-studio-windows.ps1'
          $ideCode = Get-Content $ideScript -Raw
          $ideCode.Replace('"idea.config.path=$config", "idea.system.path=$system",', '"idea.config.path=$config", "idea.system.path=$system", "idea.log.path=$system/log",') | Set-Content $ideScript -Encoding utf8
      - name: Windows build unit tests and lint
        id: build
        run: ./tools/windows-ci.ps1 -Phase Build -DeviceTests
      - name: Android emulator cycles and Android Studio Run
        timeout-minutes: 35
        run: |
          ./tools/windows-ci.ps1 -Phase Device -DeviceTests
          # Keep the guest and IDE in the same Windows console lifetime.
          ./tools/capture-studio-windows.ps1
      - name: Preserve readable emulator startup diagnostics
        if: ${{ !cancelled() }}
        run: |
          Get-Content ./artifacts/windows/bootstrap/emulator-stdout.txt -Tail 90 -ErrorAction SilentlyContinue
          Get-Content ./artifacts/windows/bootstrap/emulator-stderr.txt -Tail 50 -ErrorAction SilentlyContinue
          Get-Content ./artifacts/windows/bootstrap/android-live-logcat.txt -Tail 100 -ErrorAction SilentlyContinue
      - name: Preserve APK original screenshots and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: service-countdown-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: service-lab/artifacts/windows
          if-no-files-found: error
          retention-days: 7
      - name: Stop disposable emulator
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Continue'
          & (Join-Path $env:ANDROID_HOME 'platform-tools/adb.exe') -s emulator-5554 emu kill
          exit 0
