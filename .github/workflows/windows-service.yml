name: Windows Service countdown verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: service-countdown-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: service-lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract the anonymized Android teaching project
        working-directory: ${{ github.workspace }}
        run: Expand-Archive ./service-countdown-source.zip -DestinationPath ./service-lab -Force
      - name: Windows build unit tests and lint
        run: ./tools/windows-ci.ps1 -Phase Build -DeviceTests
      - name: Android emulator two complete countdown cycles
        timeout-minutes: 35
        run: ./tools/windows-ci.ps1 -Phase Device -DeviceTests
      - name: Android Studio project sync and Run
        timeout-minutes: 15
        run: ./tools/capture-studio-windows.ps1
      - name: Preserve APK original screenshots and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: service-countdown-windows-${{ github.run_id }}
          path: service-lab/artifacts/windows
          if-no-files-found: error
          retention-days: 7
      - name: Stop disposable emulator
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Continue'
          & (Join-Path $env:ANDROID_HOME 'platform-tools/adb.exe') -s emulator-5554 emu kill
          exit 0
