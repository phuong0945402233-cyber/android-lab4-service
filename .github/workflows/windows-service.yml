name: Windows Service countdown verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: service-lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare the Android 9 emulator configuration
        working-directory: ${{ github.workspace }}
        run: |
          Expand-Archive ./service-countdown-source.zip -DestinationPath ./service-lab -Force
          $bootstrap = './service-lab/tools/windows-ci.ps1'
          $code = Get-Content $bootstrap -Raw
          $old = '$acceleration = if ($LASTEXITCODE -eq 0) { ''auto'' } else { ''off'' }'
          if (-not $code.Contains($old)) { throw 'Unexpected emulator bootstrap.' }
          $code = $code.Replace($old, '$acceleration = ''off''')
          # Official 28.0.25 contains the renderer that shipped for Android 9.
          $code = $code.Replace('emulator-windows_x64-13610412.zip','emulator-windows-5395263.zip')
          $code = $code.Replace('https://edgedl.me.gvt1.com/edgedl/android/repository/','https://dl.google.com/android/repository/')
          $code = $code.Replace('0865071aecf3d90a5b967cb6cb0cd48bea0a58a26ef4953b32037671c129b7e9','842b8efa903dc0f5816a7aedd57f8dcb32f233c794129c1c809a1ecfc40775cf')
          $code = $code.Replace("@('major','35'),@('minor','6'),@('micro','11')", "@('major','28'),@('minor','0'),@('micro','25')")
          $code = $code.Replace("'-feature','-Vulkan','-no-metrics',", "'-verbose','-show-kernel',")
          $code = $code.Replace("'-cores','1'", "'-cores','2'")
          $code = $code.Replace('hw.lcd.width=720','hw.lcd.width=540').Replace('hw.lcd.height=1280','hw.lcd.height=960').Replace('hw.lcd.density=320','hw.lcd.density=240')
          $code = $code.Replace('.AddMinutes(25)', '.AddMinutes(10)').Replace('within 25 minutes','within 10 minutes')
          $oldProbe = '        if ($LASTEXITCODE -eq 0 -and "$boot".Trim() -eq ''1'') { $booted = $true; break }'
          $probe = @'
                  if ($LASTEXITCODE -eq 0 -and "$boot".Trim() -eq '1') {
                      $ready = (& $adb -s emulator-5554 shell service check settings 2>$null | Out-String).Trim()
                      $ready | Tee-Object -FilePath (Join-Path $logs 'boot-readiness.txt') -Append
                      if ($ready -eq 'Service settings: found') { $booted = $true; break }
                  }
          '@
          if (-not $code.Contains($oldProbe)) { throw 'Unexpected boot probe.' }
          $code = $code.Replace($oldProbe, $probe)
          $marker = '    & $adb -s emulator-5554 shell input keyevent 82'
          $diagnostics = @'
              $logcat = Start-Process -FilePath $adb -ArgumentList @('-s','emulator-5554','logcat','-v','threadtime') -PassThru -RedirectStandardOutput (Join-Path $logs 'android-live-logcat.txt') -RedirectStandardError (Join-Path $logs 'android-live-logcat-errors.txt')
              & $adb -s emulator-5554 shell getprop | Set-Content (Join-Path $logs 'android-properties.txt')
          '@
          if (-not $code.Contains($marker)) { throw 'Unexpected boot diagnostics marker.' }
          $code.Replace($marker, $diagnostics + "`r`n" + $marker) | Set-Content $bootstrap -Encoding utf8
          $verify = './service-lab/tools/verify-windows.ps1'
          (Get-Content $verify -Raw).Replace("@('install','-r',", "@('install','--no-streaming','-r',") | Set-Content $verify -Encoding utf8
          $settings = './service-lab/settings.gradle'
          $repo = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }; mavenCentral()'
          (Get-Content $settings -Raw).Replace('mavenCentral()', $repo) | Set-Content $settings -Encoding utf8
          'org.gradle.workers.max=2' | Add-Content './service-lab/gradle.properties'
          $ideScript = './service-lab/tools/capture-studio-windows.ps1'
          (Get-Content $ideScript -Raw).Replace('"idea.config.path=$config", "idea.system.path=$system",', '"idea.config.path=$config", "idea.system.path=$system", "idea.log.path=$system/log",') | Set-Content $ideScript -Encoding utf8
      - name: Windows build unit tests and lint
        run: ./tools/windows-ci.ps1 -Phase Build -DeviceTests
      - name: Android 9 device and Android Studio Run
        timeout-minutes: 33
        run: |
          $deviceFailure = $null
          try {
            ./tools/windows-ci.ps1 -Phase Device -DeviceTests
            if ($LASTEXITCODE -ne 0) { throw 'Device verification failed.' }
          } catch {
            $deviceFailure = $_
            Write-Warning ($_.ToString())
          }
          ./tools/capture-studio-windows.ps1
          if ($deviceFailure) { throw $deviceFailure }
      - name: Preserve readable emulator diagnostics
        if: ${{ !cancelled() }}
        run: |
          Get-Content ./artifacts/windows/bootstrap/emulator-stdout.txt -Tail 50 -ErrorAction SilentlyContinue
          Get-Content ./artifacts/windows/bootstrap/emulator-stderr.txt -Tail 50 -ErrorAction SilentlyContinue
          Get-Content ./artifacts/windows/bootstrap/android-live-logcat.txt -Tail 80 -ErrorAction SilentlyContinue
      - name: Preserve APK original screenshots and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: service-countdown-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: service-lab/artifacts/windows
          if-no-files-found: error
          retention-days: 7
      - name: Stop disposable emulator
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Continue'
          & (Join-Path $env:ANDROID_HOME 'platform-tools/adb.exe') -s emulator-5554 emu kill
          exit 0
